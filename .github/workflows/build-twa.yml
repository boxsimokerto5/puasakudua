- name: 🚀 Inisialisasi & Build TWA
        run: |
          mkdir -p twa-app
          cd twa-app

          cat << EOF > twa-manifest.json
          {
            "packageId": "com.puasaku.srt1kediri",
            "host": "ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app",
            "name": "PUASAKU - SRT 1 KEDIRI",
            "launcherName": "PUASAKU",
            "themeColor": "#064e3b",
            "navigationColor": "#064e3b",
            "backgroundColor": "#064e3b",
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/android-chrome-512x512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/android-chrome-512x512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "signingKey": {
              "path": "$KEYSTORE_FILE",
              "alias": "$KEY_ALIAS"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": false
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false
          }
          EOF

          # Gunakan 'yes' otomatis dan flag --skipUpdateCheck & --skipPwaValidation
          yes "no" | bubblewrap build \
            --manifest=twa-manifest.json \
            --skipUpdateCheck \
            --skipPwaValidation \
            --signingKeyPath="$KEYSTORE_FILE" \
            --signingKeyAlias="$KEY_ALIAS" \
            --keyPassword="$KEY_PASS" \
            --storePassword="$STORE_PASS" || true

          # Jika proyek belum terbentuk, jalankan init lalu build
          if [ ! -d "app" ]; then
            yes "no" | bubblewrap init --manifest=twa-manifest.json --skipPwaValidation || true
            yes "no" | bubblewrap build --skipUpdateCheck --skipPwaValidation --signingKeyPath="$KEYSTORE_FILE" --signingKeyAlias="$KEY_ALIAS" --keyPassword="$KEY_PASS" --storePassword="$STORE_PASS"
          fi

          cd ..

          # Pindahkan hasil AAB & APK ke folder output
          find twa-app -name "*.aab" -exec cp {} output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab \;
          find twa-app -name "*.apk" -exec cp {} output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk \;

          # Simpan keystore dan detail login
          zip -j output-twa/release-keystore.zip "$KEYSTORE_FILE"
          echo "Key Alias: $KEY_ALIAS | Password: $STORE_PASS" > output-twa/keystore-info.txt
