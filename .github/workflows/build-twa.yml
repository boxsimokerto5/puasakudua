name: 🚀 Build TWA Android (Signed AAB & APK for Play Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      host_domain:
        description: 'Domain Host TWA (misal: puasaku.sekolahrakyat.sch.id atau domain preview)'
        required: false
        default: 'ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app'
        type: string
      version_code:
        description: 'Android Version Code (integer, naikkan setiap rilis Play Store, misal: 1, 2, 3...)'
        required: false
        default: '1'
        type: string
      version_name:
        description: 'Android Version Name (misal: 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-twa:
    name: 📦 Build TWA Bundle (.aab) & APK (Signed)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Project Dependencies & Generate Icons
        run: |
          npm install
          node scripts/generate-icons.js
          npm run build

      - name: 🌐 Install Google Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: 🔑 Persiapkan Keystore Release
        id: setup_keystore
        run: |
          mkdir -p output-twa
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          
          # Cek apakah pengguna menyimpan ANDROID_KEYSTORE_BASE64 di GitHub Secrets
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore resmi dari GitHub Secrets (ANDROID_KEYSTORE_BASE64)..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'puasaku_key' }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD || 'puasaku123456' }}"
            STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'puasaku123456' }}"
          else
            echo "Secrets tidak ditemukan. Membuat Keystore release baru otomatis untuk proses signing..."
            KEY_ALIAS="puasaku_key"
            KEY_PASS="puasaku123456"
            STORE_PASS="puasaku123456"
            
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PUASAKU SRT 1 KEDIRI, OU=IT Department, O=Sekolah Rakyat 1 Kediri, L=Kediri, ST=Jawa Timur, C=ID"
          fi

          # Ekstrak SHA-256 Fingerprint untuk Digital Asset Links
          echo "=========================================================="
          echo "📋 SHA-256 CERTIFICATE FINGERPRINT UNTUK assetlinks.json:"
          SHA256_FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep "SHA256:" | awk '{print $2}')
          echo "$SHA256_FINGERPRINT"
          echo "=========================================================="

          # Simpan ke environment workflow
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "SHA256_FINGERPRINT=$SHA256_FINGERPRINT" >> $GITHUB_ENV

          # Buat file assetlinks.json siap pakai dengan fingerprint ini
          cat <<EOF > output-twa/assetlinks.json
[
  {
    "relation": ["delegate_permission/common.handle_all_urls"],
    "target": {
      "namespace": "android_app",
      "package_name": "com.puasaku.srt1kediri",
      "sha256_cert_fingerprints": [
        "$SHA256_FINGERPRINT"
      ]
    }
  }
]
EOF

      - name: 🛠️ Generate Project Android TWA dengan Bubblewrap
        run: |
          TARGET_HOST="${{ github.event.inputs.host_domain || 'ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '1' }}"
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          
          echo "Target Host Domain: $TARGET_HOST"
          echo "Version Code: $VERSION_CODE | Version Name: $VERSION_NAME"

          # Salin file twa-manifest.json dan sesuaikan nilai host & versi
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.host = '$TARGET_HOST';
            manifest.appVersionCode = parseInt('$VERSION_CODE', 10);
            manifest.appVersionName = '$VERSION_NAME';
            manifest.fullScopeUrl = 'https://$TARGET_HOST/';
            manifest.webManifestUrl = 'https://$TARGET_HOST/manifest.json';
            manifest.signingKey.path = '$KEYSTORE_FILE';
            manifest.signingKey.alias = '$KEY_ALIAS';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

          # Inisialisasi Android project TWA dari twa-manifest.json
          mkdir -p twa-android
          cd twa-android
          cp ../twa-manifest.json .
          
          # Salin icon lokal ke folder build TWA jika diperlukan
          bubblewrap generate --manifest=twa-manifest.json
          
      - name: 🔨 Build Android App Bundle (.aab) & APK (Signed)
        run: |
          cd twa-android
          
          echo "Menjalankan kompilasi Gradle untuk AAB (Play Store) & APK..."
          chmod +x gradlew
          
          # Build signed bundle AAB dan signed APK
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --no-daemon --stacktrace

          # Pindahkan file hasil build ke folder output-twa
          cd ..
          
          AAB_FILE=$(find twa-android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find twa-android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab
            echo "✓ Signed AAB siap untuk Google Play Store: output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab"
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk
            echo "✓ Signed APK siap untuk instalasi manual di HP: output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk"
          fi

          # Backup Keystore ke zip (hanya jika di-generate otomatis, untuk memudahkan pengguna menyimpan file .keystore-nya)
          zip -j output-twa/release-keystore.zip "$KEYSTORE_FILE"
          echo "Key Alias: $KEY_ALIAS | Password: $STORE_PASS" > output-twa/keystore-info.txt

      - name: 📤 Upload Artifacts (AAB, APK, & AssetLinks)
        uses: actions/upload-artifact@v4
        with:
          name: Puasaku-TWA-GooglePlay-Build
          path: |
            output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab
            output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk
            output-twa/assetlinks.json
            output-twa/keystore-info.txt
            output-twa/release-keystore.zip
          retention-days: 30

      - name: 🏷️ Buat Release GitHub (Jika Push Tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab
            output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk
            output-twa/assetlinks.json
          name: Rilis TWA ${{ github.ref_name }}
          body: |
            ## 🚀 PUASAKU SRT 1 KEDIRI - Rilis TWA Android (Signed)
            
            Paket aplikasi Android resmi berbasis **Trusted Web Activity (TWA)** untuk Google Play Store.
            
            ### 📦 File yang Disediakan:
            1. **`PUASAKU-SRT1Kediri-PlayStore-Release.aab`**: Unggah file ini ke **Google Play Console** (Production / Internal Testing).
            2. **`PUASAKU-SRT1Kediri-Release-Signed.apk`**: APK yang sudah ditandatangani untuk dites langsung di HP Android tanpa melalui Play Store.
            3. **`assetlinks.json`**: Letakkan di hosting web Anda pada path `/.well-known/assetlinks.json` agar bilah alamat browser otomatis hilang di Play Store.
          draft: false
          prerelease: false
