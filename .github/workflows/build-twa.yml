name: 🚀 Build TWA Android (Signed AAB & APK for Play Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      host_domain:
        description: 'Domain Host TWA (misal: puasaku.pages.dev)'
        required: false
        default: 'ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app'
        type: string
      version_code:
        description: 'Android Version Code (integer)'
        required: false
        default: '1'
        type: string
      version_name:
        description: 'Android Version Name'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-twa:
    name: 📦 Build TWA Bundle (.aab) & APK (Signed)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Project Dependencies & Generate Icons
        run: |
          npm install
          node scripts/generate-icons.js
          npm run build

      - name: 🔑 Persiapkan Keystore Release
        id: setup_keystore
        run: |
          mkdir -p output-twa
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore resmi dari GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'puasaku_key' }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD || 'puasaku123456' }}"
            STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'puasaku123456' }}"
          else
            echo "Membuat Keystore release baru otomatis untuk signing..."
            KEY_ALIAS="puasaku_key"
            KEY_PASS="puasaku123456"
            STORE_PASS="puasaku123456"
            
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PUASAKU SRT 1 KEDIRI, OU=IT Department, O=Sekolah Rakyat 1 Kediri, L=Kediri, ST=Jawa Timur, C=ID"
          fi

          echo "=========================================================="
          echo "📋 MENGAMBIL SHA-256 FINGERPRINT..."
          SHA256_FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "SHA256: $SHA256_FINGERPRINT"
          echo "=========================================================="

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "SHA256_FINGERPRINT=$SHA256_FINGERPRINT" >> $GITHUB_ENV

      - name: 🔨 Eksekusi Build Android TWA (AAB & APK Signed)
        env:
          TARGET_HOST: ${{ github.event.inputs.host_domain || 'ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p output-twa
          mkdir -p twa-project/app/src/main/res/values
          mkdir -p twa-project/app/src/main/res/mipmap-hdpi
          mkdir -p twa-project/app/src/main/res/mipmap-mdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xhdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xxxhdpi

          cp public/android-chrome-192x192.png twa-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          cp public/android-chrome-512x512.png twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true

          # 1. settings.gradle
          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "PuasakuTWA"\ninclude ":app"\n' > twa-project/settings.gradle

          # 2. build.gradle
          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:8.2.2"\n    }\n}\n' > twa-project/build.gradle

          # 3. app/build.gradle
          cat << 'GRADLE_EOF' > twa-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.puasaku.srt1kediri'
              compileSdk 34
              defaultConfig {
                  applicationId "com.puasaku.srt1kediri"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  resValue "string", "app_name", "PUASAKU - SRT 1 KEDIRI"
                  resValue "string", "package_name", "com.puasaku.srt1kediri"
                  resValue "string", "host_name", "ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app"
                  resValue "string", "default_url", "https://ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app/"
                  resValue "color", "colorPrimary", "#064e3b"
                  resValue "color", "navigationColor", "#064e3b"
                  resValue "color", "backgroundColor", "#064e3b"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_FILE'))
                      storePassword System.getenv('STORE_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'androidx.browser:browser:1.8.0'
          }
          GRADLE_EOF

          # 4. AndroidManifest.xml
          cat << 'MANIFEST_EOF' > twa-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.puasaku.srt1kediri">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="@string/default_url" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="@string/host_name" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          # 5. Asset Statements & assetlinks.json
          echo '<resources><string name="asset_statements" translatable="false">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"android_app\", \"package_name\": \"com.puasaku.srt1kediri\", \"sha256_cert_fingerprints\": [\"'$SHA256_FINGERPRINT'\"]}}]</string></resources>' > twa-project/app/src/main/res/values/strings.xml
          echo '[{"relation": ["delegate_permission/common.handle_all_urls"],"target": {"namespace": "android_app","package_name": "com.puasaku.srt1kediri","sha256_cert_fingerprints": ["'$SHA256_FINGERPRINT'"]}}]' > output-twa/assetlinks.json

          # 6. Build Gradle
          cd twa-project
          curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle bundleRelease assembleRelease --no-daemon
          cd ..

          find twa-project/app/build/outputs/bundle/release -name "*.aab" -exec cp {} output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab \;
          find twa-project/app/build/outputs/apk/release -name "*.apk" -exec cp {} output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk \;

          zip -j output-twa/release-keystore.zip "$KEYSTORE_FILE"
          echo "Key Alias: $KEY_ALIAS | Password: $STORE_PASS" > output-twa/keystore-info.txt

      - name: 📤 Upload Artifacts (AAB, APK, & AssetLinks)
        uses: actions/upload-artifact@v4
        with:
          name: Puasaku-TWA-GooglePlay-Build
          path: |
            output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab
            output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk
            output-twa/assetlinks.json
            output-twa/keystore-info.txt
            output-twa/release-keystore.zip
          retention-days: 30
