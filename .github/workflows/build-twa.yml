name: 🚀 Build TWA Android (Signed AAB & APK for Play Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-twa:
    name: 📦 Build TWA Bundle (.aab) & APK (Signed)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Bubblewrap CLI (Resmi Google Chrome)
        run: |
          npm install -g @bubblewrap/cli

      - name: 🔑 Persiapkan Keystore Release
        id: setup_keystore
        run: |
          mkdir -p output-twa
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          KEY_ALIAS="puasaku_key"
          KEY_PASS="puasaku123456"
          STORE_PASS="puasaku123456"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=PUASAKU SRT 1 KEDIRI, OU=IT, O=Sekolah Rakyat 1 Kediri, L=Kediri, ST=Jawa Timur, C=ID"

          SHA256_FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "SHA-256 Fingerprint: $SHA256_FINGERPRINT"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "SHA256_FINGERPRINT=$SHA256_FINGERPRINT" >> $GITHUB_ENV

          # Buat file assetlinks.json siap pakai
          cat << EOF > output-twa/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.puasaku.srt1kediri",
                "sha256_cert_fingerprints": [
                  "$SHA256_FINGERPRINT"
                ]
              }
            }
          ]
          EOF

      - name: 🚀 Inisialisasi & Build TWA (Google Bubblewrap)
        run: |
          mkdir -p twa-app
          cd twa-app

          # Buat konfigurasi twa-manifest.json resmi
          cat << EOF > twa-manifest.json
          {
            "packageId": "com.puasaku.srt1kediri",
            "host": "ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app",
            "name": "PUASAKU - SRT 1 KEDIRI",
            "launcherName": "PUASAKU",
            "themeColor": "#064e3b",
            "navigationColor": "#064e3b",
            "backgroundColor": "#064e3b",
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/android-chrome-512x512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/android-chrome-512x512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "signingKey": {
              "path": "$KEYSTORE_FILE",
              "alias": "$KEY_ALIAS"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": false
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false
          }
          EOF

          # Generate proyek Android
          bubblewrap build --manifest=twa-manifest.json --signingKeyPath="$KEYSTORE_FILE" --signingKeyAlias="$KEY_ALIAS" --keyPassword="$KEY_PASS" --storePassword="$STORE_PASS"

          cd ..
          
          # Pindahkan hasil AAB & APK ke folder output
          find twa-app -name "*.aab" -exec cp {} output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab \;
          find twa-app -name "*.apk" -exec cp {} output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk \;

          # Simpan keystore dan detail login
          zip -j output-twa/release-keystore.zip "$KEYSTORE_FILE"
          echo "Key Alias: $KEY_ALIAS | Password: $STORE_PASS" > output-twa/keystore-info.txt

      - name: 📤 Upload Artifacts (AAB, APK, & AssetLinks)
        uses: actions/upload-artifact@v4
        with:
          name: Puasaku-TWA-GooglePlay-Build
          path: |
            output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab
            output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk
            output-twa/assetlinks.json
            output-twa/keystore-info.txt
            output-twa/release-keystore.zip
          retention-days: 30
