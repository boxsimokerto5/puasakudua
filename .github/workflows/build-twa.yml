name: 🚀 Build TWA Android (Signed AAB & APK for Play Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-twa:
    name: 📦 Build TWA Bundle (.aab) & APK (Signed)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies & Generate Icons
        run: |
          npm install
          node scripts/generate-icons.js || true

      - name: 🔑 Persiapkan Keystore Release
        id: setup_keystore
        run: |
          mkdir -p output-twa
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          KEY_ALIAS="puasaku_key"
          KEY_PASS="puasaku123456"
          STORE_PASS="puasaku123456"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=PUASAKU SRT 1 KEDIRI, OU=IT, O=Sekolah Rakyat 1 Kediri, L=Kediri, ST=Jawa Timur, C=ID"

          SHA256_FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "SHA-256 Fingerprint: $SHA256_FINGERPRINT"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "SHA256_FINGERPRINT=$SHA256_FINGERPRINT" >> $GITHUB_ENV

          cat << EOF > output-twa/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.puasaku.srt1kediri",
                "sha256_cert_fingerprints": [
                  "$SHA256_FINGERPRINT"
                ]
              }
            }
          ]
          EOF

      - name: 🌐 Siapkan Proyek Android TWA Native & Kompilasi
        run: |
          mkdir -p twa-project/app/src/main/res/values
          mkdir -p twa-project/app/src/main/res/mipmap-hdpi
          mkdir -p twa-project/app/src/main/res/mipmap-mdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xhdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xxxhdpi

          cp public/android-chrome-192x192.png twa-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          cp public/android-chrome-512x512.png twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          cp public/android-chrome-192x192.png twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          cp public/android-chrome-192x192.png twa-project/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
          cp public/android-chrome-192x192.png twa-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true

          cat << 'EOF' > twa-project/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > twa-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuasakuTWA"
          include ':app'
          EOF

          cat << 'EOF' > twa-project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          EOF

          cat << EOF > twa-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.puasaku.srt1kediri'
              compileSdk 34

              defaultConfig {
                  applicationId "com.puasaku.srt1kediri"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"

                  resValue "string", "app_name", "PUASAKU - SRT 1 KEDIRI"
                  resValue "string", "package_name", "com.puasaku.srt1kediri"
                  resValue "string", "host_name", "ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app"
                  resValue "string", "default_url", "https://ais-pre-i5tusnjnohh6qfhmyvnunv-95670230943.asia-east1.run.app/"
                  resValue "color", "colorPrimary", "#064e3b"
                  resValue "color", "navigationColor", "#064e3b"
                  resValue "color", "backgroundColor", "#064e3b"
              }

              signingConfigs {
                  release {
                      storeFile file('${KEYSTORE_FILE}')
                      storePassword '${STORE_PASS}'
                      keyAlias '${KEY_ALIAS}'
                      keyPassword '${KEY_PASS}'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'androidx.browser:browser:1.8.0'
          }
          EOF

          cat << 'EOF' > twa-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.puasaku.srt1kediri">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">

                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="@string/default_url" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/colorPrimary" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/navigationColor" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                          android:resource="@color/backgroundColor" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="@string/host_name" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << EOF > twa-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="asset_statements" translatable="false">
                  [{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"android_app\\", \\"package_name\\": \\"com.puasaku.srt1kediri\\", \\"sha256_cert_fingerprints\\": [\\"${SHA256_FINGERPRINT}\\"]}}]
              </string>
          </resources>
          EOF

          cd twa-project
          curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          chmod +x ./gradle-8.5/bin/gradle
          ./gradle-8.5/bin/gradle bundleRelease assembleRelease --no-daemon

          cd ..

          find twa-project/app/build/outputs/bundle/release -name "*.aab" -exec cp {} output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab \;
          find twa-project/app/build/outputs/apk/release -name "*.apk" -exec cp {} output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk \;

          zip -j output-twa/release-keystore.zip "$KEYSTORE_FILE"
          echo "Key Alias: $KEY_ALIAS | Password: $STORE_PASS" > output-twa/keystore-info.txt

      - name: 📤 Upload Artifacts (AAB, APK, & AssetLinks)
        uses: actions/upload-artifact@v4
        with:
          name: Puasaku-TWA-GooglePlay-Build
          path: |
            output-twa/PUASAKU-SRT1Kediri-PlayStore-Release.aab
            output-twa/PUASAKU-SRT1Kediri-Release-Signed.apk
            output-twa/assetlinks.json
            output-twa/keystore-info.txt
            output-twa/release-keystore.zip
          retention-days: 30
